<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adidas</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>


<body>


    <!-- TOP BLACK BAR -->

    <div class="top-bar">

        <span>STUDENTS GET 15% OFF</span>

        <i class="fa-solid fa-chevron-down"></i>

    </div>



    <!-- HEADER -->

    <header class="header">


        <!-- LOGO -->

        <div class="logo">

            <img src="./Performance_logo_Black.webp"
                 alt="Adidas Logo">

        </div>



        <!-- TOP LINKS -->

        <div class="top-links">

            <a href="#">store finder</a>

            <a href="#">help</a>

            <a href="#">orders and returns</a>

            <a href="#">sign up</a>

            <a href="#">log in</a>

        </div>



        <!-- NAVIGATION -->

        <nav class="nav-links">

            <a href="#">SHOES</a>

            <a href="#">MEN</a>

            <a href="#">WOMEN</a>

            <a href="#">KIDS</a>

            <a href="#">SPORTS & LIFESTYLE</a>

            <a href="#">OUTLET</a>

        </nav>



        <!-- RIGHT SIDE -->

        <div class="right-section">


            <!-- SEARCH -->

            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>



            <!-- USER -->

            <div class="icon-box account">

                <i class="fa-regular fa-user"></i>

               

            </div>



            <!-- HEART -->

            <div class="icon-box">

                <i class="fa-regular fa-heart"></i>

            </div>



            <!-- BAG -->

            <div class="icon-box">

                <i class="fa-solid fa-bag-shopping"></i>

            </div>


        </div>


    </header>



    <!-- HERO -->

    <section class="hero">

    </section>


</body>

</html>
